[project]
name = "api-diver"
version = "0.7.2"
description = "Cartographie des swaggers/OpenAPI (multi-domaines, multi-APIs) en skills agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
api-diver = "api_diver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_diver"]

[dependency-groups]
dev = ["pytest>=8.0"]
